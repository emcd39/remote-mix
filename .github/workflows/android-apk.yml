name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true

      - name: Install Android 35 platform and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Test and build APK
        run: java -cp gradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain

      - name: Prepare release APK
        id: release
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)"/\1/p' app/build.gradle.kts | head -n 1)
          test -n "$version"
          tag="v${version}-build.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/RemoteMix-${version}-debug.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ steps.release.outputs.tag }}" \
            "release/RemoteMix-${{ steps.release.outputs.version }}-debug.apk" \
            --target "$GITHUB_SHA" \
            --title "Remote Mix ${{ steps.release.outputs.version }} (build $GITHUB_RUN_NUMBER)" \
            --notes "Automated Debug APK from commit $GITHUB_SHA. The CI debug signature may change between builds; uninstall the previous package if an update cannot be installed." \
            --prerelease
